<details class="checklist" data-paid-only>
  <summary>Content checklist <span class="small muted">· find text on every scanned page</span></summary>
  <fieldset class="presets">
    <legend>Look for</legend>
    <label class="check"><input type="checkbox" name="clp_email"> Email addresses</label>
    <label class="check"><input type="checkbox" name="clp_phone"> Phone numbers</label>
    <label class="check"><input type="checkbox" name="clp_price"> Prices</label>
    <label class="check"><input type="checkbox" name="clp_placeholder"> Placeholder text <span class="small muted">(lorem ipsum, TODO, coming soon…)</span></label>
    <label class="check"><input type="checkbox" name="clp_copyright"> Copyright notices</label>
  </fieldset>
  <div class="field">
    <label for="cl-terms">Your own words or phrases</label>
    <textarea id="cl-terms" name="cl_terms" placeholder="Old Company Name&#10;discontinued&#10;support@old-domain.com"></textarea>
    <p class="hint">One per line, up to 20. Matched as plain text in each page's visible text and its email/phone links.</p>
  </div>
  <div class="presets">
    <label class="check"><input type="checkbox" name="cl_case"> Match case</label>
    <label class="check"><input type="checkbox" name="cl_word"> Whole words only</label>
  </div>
</details>
