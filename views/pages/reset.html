<section class="wrap page">
  <div class="form-card">
    <h1>Choose a new password</h1>
    <form id="reset-form" novalidate>
      <div class="field"><label for="r-password">New password</label><input id="r-password" name="password" type="password" autocomplete="new-password" minlength="8" required><p class="hint">At least 8 characters.</p></div>
      <button class="btn" type="submit">Save password</button>
      <p class="form-error" role="alert"></p>
    </form>
  </div>
</section>
