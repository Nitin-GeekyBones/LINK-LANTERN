<section class="wrap page">
  <div class="form-card">
    <h1>Log in</h1>
    <form id="login-form" novalidate>
      <div class="field"><label for="l-email">Email</label><input id="l-email" name="email" type="email" autocomplete="email" required></div>
      <div class="field"><label for="l-password">Password</label><input id="l-password" name="password" type="password" autocomplete="current-password" required></div>
      <button class="btn" type="submit">Log in</button>
      <p class="form-error" role="alert"></p>
    </form>
    <p class="small"><a href="/forgot">Forgotten your password?</a></p>
    <p class="small">New here? <a href="/signup" data-keep-next>Create a free account</a></p>
  </div>
</section>
